<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Product</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
         .abc {
        margin-left: auto; 
    }
    
    </style>
</head>
<body style="background-color: aqua; text-align: center;">
    
    <h1>Add a New Product</h1>
    <div style="margin-left: 1px; margin-right: 1400px;">
             <a href="F:\perfume web\perfume home page.html"><input type="button" id="button" value="🔙back"></a>
</div>
    <div style="background-color: rgb(203, 230, 221);">
    <form action="/submit-product" method="POST" enctype="multipart/form-data">
        <label for="productName">Product Name:</label>
        <input type="text" id="productName" name="productName" placeholder="Enter product name" required>

        <label for="productDescription">Product Description:</label>
        <textarea id="productDescription" name="productDescription" rows="4" placeholder="Enter product description" required></textarea>

        <label for="productPrice">Price (₹):</label>
        <input type="number" id="productPrice" name="productPrice" placeholder="Enter product price" required>

        <label for="productImage">Product Image:</label>
        <input type="file" id="productImage" name="productImage" accept="image/*" required>

        <button type="submit">Add Product</button>
    </form>
    </div>
    
    <fieldset style="background-color: black; margin-top: 1px; margin-bottom: 10px; margin-left: 0px; margin-right: 0px;">
